name: Deploy
# Development phase: every push builds and deploys, no test gate (tests and the tool gate still run locally:
# pnpm test, pnpm test:e2e, pnpm gate).
#   main            → production build (canonical/sitemap on SITE_URL, indexable) → https://lovert.pages.dev
#   any other branch → preview build (noindex, no canonical) → <hash>.lovert.pages.dev and <branch>.lovert.pages.dev
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (production on main, preview elsewhere) + link/SEO check
        env:
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
          SITE_URL: ${{ github.ref == 'refs/heads/main' && vars.SITE_URL || '' }}
        run: pnpm build:deploy
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.0 pages deploy apps/web/out --project-name="${{ vars.CF_PAGES_PROJECT }}" \
            --branch="${{ github.ref_name }}" --commit-hash="${{ github.sha }}" --commit-dirty=false | tee deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | head -1)
          echo "Deployed ${{ github.ref_name }} @ ${{ github.sha }}: $url" >> "$GITHUB_STEP_SUMMARY"
