name: CI
on:
  pull_request:
  # Every push builds and tests. Pushes to branches other than main also run the release gate and,
  # when both gates pass, deploy that exact artifact as a Cloudflare Pages Preview. main is never deployed here.
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# Every report, trace and gate verdict is tied to one commit and one run attempt:
# artifact names carry the SHA and run attempt; tool-gate-*.json records sha/run (scripts/tool-gate.mjs).

# One run per branch at a time; a newer push cancels the older run (its artifacts stay attached to that run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required to merge (make "check" a required status check on main in the branch protection settings).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate:registry
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:report
      - run: pnpm build:deploy
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e --output=test-results/merge
      - name: Tool gate (merge)
        if: always()
        run: pnpm gate
      - run: pnpm build:prod-check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-reports-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            reports
            test-results
          if-no-files-found: warn
          retention-days: 30

  # Required before a release (tags, manual run). The site artifact uploaded here is the one that passed the release gate;
  # a deploy job must download it from this run (same SHA) instead of rebuilding.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:deploy
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:report
      # Separate output folders so one Playwright run never deletes another run's traces; each step runs even if one failed.
      - run: pnpm test:e2e --output=test-results/merge
      - if: always()
        run: pnpm test:e2e:release --output=test-results/release
      - name: Race cases repeated (stale-file, stale-read, stale-setting, route-change)
        if: always()
        run: pnpm exec playwright test tests/e2e/tool-common.spec.ts -g "stale-|route-change" --repeat-each=5 --reporter=line,json --output=test-results/race
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/e2e-race.json
      - name: First-use race repeated (regression for the late-cancel bug, WebKit)
        if: always()
        run: pnpm exec playwright test tests/e2e/data-convert.spec.ts -g "csv-to-json:full-compare" --project=webkit --project=mobile-webkit --repeat-each=100 --reporter=line --output=test-results/first-use
      - name: Tool gate (release)
        if: always()
        run: pnpm gate:release
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            reports
            test-results
          if-no-files-found: warn
          retention-days: 90
      - name: Upload the gated static export
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: apps/web/out
          retention-days: 90

  # Preview only: deploys the exact static export that passed the release gate in this run (artifact site-<sha>).
  # Never production: refuses to run when this branch is the Pages project's production branch.
  # Needs repository variable CF_PAGES_PROJECT and secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
  preview:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: Refuse the production branch
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          BRANCH: ${{ github.ref_name }}
        run: |
          test -n "$PROJECT" || { echo "CF_PAGES_PROJECT is not set"; exit 1; }
          prod=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT" | jq -r '.result.production_branch')
          echo "Pages production branch: $prod · this branch: $BRANCH"
          test -n "$prod" && test "$prod" != "null" || { echo "could not read the production branch"; exit 1; }
          test "$prod" != "$BRANCH" || { echo "Refusing: $BRANCH is the production branch"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: site
      - name: Deploy the gated artifact as a Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.0 pages deploy site --project-name="${{ vars.CF_PAGES_PROJECT }}" \
            --branch="${{ github.ref_name }}" --commit-hash="${{ github.sha }}" --commit-dirty=false | tee deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url (sha ${{ github.sha }}, artifact site-${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"

  # Production: manual run on main only, after check + release passed for this SHA in this run.
  # Same source as the gated artifact; only the deploy environment differs (DEPLOY_ENV/SITE_URL → canonical, sitemap, index).
  # Uses the GitHub environment "production" (add required reviewers there to require an approval per deploy).
  production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build + SEO/link check
        env:
          DEPLOY_ENV: production
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "SITE_URL variable is not set"; exit 1; }
          pnpm build
          node scripts/check-build.mjs
      - name: Confirm the Pages production branch is main
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          prod=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT" | jq -r '.result.production_branch')
          echo "Pages production branch: $prod"
          test "$prod" = "main" || { echo "Refusing: production branch is '$prod', expected main"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: site-production-${{ github.sha }}
          path: apps/web/out
          retention-days: 90
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.0 pages deploy apps/web/out --project-name="${{ vars.CF_PAGES_PROJECT }}" \
            --branch=main --commit-hash="${{ github.sha }}" --commit-dirty=false | tee deploy.log
          echo "Production: ${{ vars.SITE_URL }} (sha ${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Smoke test on the production URL
        env:
          SMOKE_URL: ${{ vars.SITE_URL }}
          SMOKE_KIND: production
          EXPECT_ORIGIN: ${{ vars.SITE_URL }}
        run: pnpm smoke --output=test-results/smoke-production
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-reports-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            reports
            test-results
          if-no-files-found: warn
